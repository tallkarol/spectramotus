name: Studio checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: spectramotus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-studio.txt pytest
      - run: node --test tests/gesture-gate.test.cjs tests/player-queue.test.cjs tests/diagnostics.test.cjs
      - run: python -m pytest tests/test_studio.py tests/test_accounts.py tests/test_pi_launcher.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/spectramotus_test
