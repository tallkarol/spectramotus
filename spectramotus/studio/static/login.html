<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectramotus · Sign in</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafb;color:#272832;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}main{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.visual{background:#181a20;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:70px}.visual:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#53506155,transparent 65%)}.composition{position:relative;width:280px;height:370px;transform:rotate(-7deg)}.card{position:absolute;inset:0;border:1px solid #77717e;border-radius:12px;background:linear-gradient(145deg,#747384,#444654 55%,#242b34);box-shadow:0 35px 70px #0006}.card:before{content:'';position:absolute;inset:15px;border:1px solid #a6a1b74d;border-radius:5px}.back{transform:rotate(20deg) translate(22px,-8px);opacity:.4}.middle{transform:rotate(9deg) translate(7px,-4px);opacity:.6}.front{display:flex;align-items:center;justify-content:center}.abstract-window{width:140px;height:190px;border-radius:75px 75px 10px 10px;overflow:hidden;position:relative;background:#a5a6b3}.abstract-window span{position:absolute;inset:50% -20% -10%;border-radius:50%;background:#727b8b;transform:rotate(-25deg)}.abstract-window span:nth-child(2){inset:65% -25% -30%;background:#4e5c6e;transform:rotate(25deg)}.abstract-window span:nth-child(3){inset:82% -10% -20%;background:#303d51}.visual-caption{position:absolute;left:50px;bottom:45px;color:#8b8996;font-size:12px;letter-spacing:.03em}.form-side{display:flex;align-items:center;justify-content:center;position:relative;padding:70px 36px}.content{width:360px;max-width:100%}.logo{width:230px;margin-bottom:60px}.product-name{font-size:25px;font-weight:650;letter-spacing:-1.2px}h1{font-size:31px;font-weight:620;letter-spacing:-.045em;margin:0 0 12px}p{color:#92939f;line-height:1.7;font-size:14px;margin:0 0 32px}label{display:block;font-size:13px;font-weight:550;margin-bottom:9px}input{font:inherit;border:1px solid #dddde6;border-radius:8px;padding:14px;width:100%;background:white;color:#30323b;outline-offset:3px}input:focus{outline:2px solid #afa0e1}button{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:0;border-radius:8px;background:#6254d9;color:white;padding:14px;width:100%;margin-top:20px;cursor:pointer;box-shadow:0 3px 8px #6254d921}button:hover{background:#5346c3}.note{font-size:12px;color:#aaa8b4;margin-top:24px;text-align:center}.footer{position:absolute;bottom:28px;font-size:11px;color:#aaa9b4;letter-spacing:.02em}@media(max-width:760px){main{grid-template-columns:1fr}.visual{display:none}.form-side{min-height:100vh;padding:40px 26px}.logo{margin-bottom:48px}}@media(prefers-reduced-motion:no-preference){.composition{animation:arrive 1.1s ease-out both}@keyframes arrive{from{opacity:0;transform:rotate(-10deg) translateY(20px)}to{opacity:1;transform:rotate(-7deg)}}}.visual{background:radial-gradient(ellipse at 30% 20%,#ffe5c3,transparent 65%),linear-gradient(155deg,#f2d7cd,#c9c9ec)}.card{background:linear-gradient(145deg,#fdf1d4,#d4b8ce 70%,#aaaecf);border:6px solid #fffcf3;border-radius:28px;box-shadow:0 30px 50px #8b6c7925}.card:before{display:none}.abstract-window{background:#f8d69d}.abstract-window span{background:#bbb8d7}.abstract-window span:nth-child(2){background:#859b95}.abstract-window span:nth-child(3){background:#5d786f}.visual-caption{color:#6a626d}.form-side{background:#faf9f6}button{background:#526852;border-radius:24px;font-size:15px}button:hover{background:#40563f}p{color:#727c78}input{border-radius:12px}.note{color:#78817c}</style></head><body><main><section class="visual" aria-hidden="true"><div class="composition"><div class="card back"></div><div class="card middle"></div><div class="card front"><div class="abstract-window"><span></span><span></span><span></span></div></div></div><span class="visual-caption">A moment, with a little more life.</span></section><section class="form-side"><div class="content"><div class="logo"><span class="product-name">spectramotus.</span></div><h1>Welcome to your studio.</h1><p>Enter your workshop password.</p><form method="post" action="/login"><label for="password">Workspace password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password"><button>Open studio</button></form><p class="note">Private workspace. Your portraits stay yours.</p></div><span class="footer">SPECTRAMOTUS · PORTRAIT STUDIO</span></section></main></body></html>
