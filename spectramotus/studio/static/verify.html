<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm sign-in · Spectramotus</title><style>*{box-sizing:border-box}body{margin:0;color:#303a35;background:radial-gradient(ellipse at 85% 10%,#e9e0f4,transparent 55%),radial-gradient(ellipse at 5% 90%,#f7e1cb,transparent 50%),#faf9f6;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:460px;margin:6vh auto;padding:34px;background:#fffdf9;border:1px solid #e8e5de;border-radius:28px;box-shadow:0 20px 80px #7161560a}h1{font-size:29px;line-height:1.2;letter-spacing:-.04em;font-weight:600;margin:0 0 16px}p{color:#747b72;margin:0 0 20px}label{font-size:13px;font-weight:550;display:block;margin-bottom:8px}input{font:inherit;width:100%;padding:12px 14px;border:1px solid #dddcd3;border-radius:12px}input:focus{outline:2px solid #a7b79e;outline-offset:2px}button,.button{font:550 14px -apple-system,sans-serif;background:#526852;color:white;border:0;border-radius:25px;padding:14px 20px;cursor:pointer;text-decoration:none;display:inline-block}button{width:100%;margin-top:17px}button:disabled{opacity:.5;cursor:wait}.small{font-size:12px;margin-top:22px}.status{font-size:14px;margin:20px 0 0}.error{color:#a44137}a{color:#526852}.email{font-weight:600;overflow-wrap:anywhere;color:#303a35}[hidden]{display:none!important}@media(max-width:550px){main{margin:30px 18px;padding:28px}}</style></head><body><!-- studio-nav --><main><h1>Your studio is ready.</h1><p id="intro">Checking your sign-in link…</p><p class="email" id="email"></p><button id="continue" disabled>Continue to Spectramotus</button><p class="status" id="status" role="status"></p><p class="small"><a href="/login">Request a new sign-in link</a></p></main><script>let token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);const status=document.querySelector('#status'),button=document.querySelector('#continue');async function post(path){const r=await fetch(path,{method:'POST',body:new URLSearchParams({token})}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'This link is unavailable. Request a new one.');return d}post('/auth/inspect').then(d=>{document.querySelector('#intro').textContent='Confirm that this is your email before continuing.';document.querySelector('#email').textContent=d.email;button.disabled=false}).catch(e=>{document.querySelector('#intro').textContent='Unable to sign in.';status.textContent=e.message;status.classList.add('error')});button.onclick=async()=>{button.disabled=true;try{await post('/auth/consume');token='';location.replace('/studio')}catch(e){status.textContent=e.message;status.classList.add('error')}};</script></body></html>
