<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Spectramotus</title><style>*{box-sizing:border-box}body{margin:0;color:#303a35;background:radial-gradient(ellipse at 85% 10%,#e9e0f4,transparent 55%),radial-gradient(ellipse at 5% 90%,#f7e1cb,transparent 50%),#faf9f6;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}header{padding:32px 40px}.wordmark{font-size:30px;font-weight:800;letter-spacing:-.07em;color:#29292d;text-decoration:none}.wordmark span{color:#db9476}main{max-width:460px;margin:6vh auto;padding:34px;background:#fffdf9;border:1px solid #e8e5de;border-radius:28px;box-shadow:0 20px 80px #7161560a}h1{font-size:29px;line-height:1.2;letter-spacing:-.04em;font-weight:600;margin:0 0 16px}p{color:#747b72;margin:0 0 20px}label{font-size:13px;font-weight:550;display:block;margin-bottom:8px}input{font:inherit;width:100%;padding:12px 14px;border:1px solid #dddcd3;border-radius:12px}input:focus{outline:2px solid #a7b79e;outline-offset:2px}button,.button{font:550 14px -apple-system,sans-serif;background:#526852;color:white;border:0;border-radius:25px;padding:14px 20px;cursor:pointer;text-decoration:none;display:inline-block}button{width:100%;margin-top:17px}button:disabled{opacity:.5;cursor:wait}.small{font-size:12px;margin-top:22px}.status{font-size:14px;margin:20px 0 0}.error{color:#a44137}a{color:#526852}.email{font-weight:600;overflow-wrap:anywhere;color:#303a35}[hidden]{display:none!important}@media(max-width:550px){header{padding:25px}main{margin:30px 18px;padding:28px}}</style></head><body><header><a class="wordmark" href="/">spectramotus<span>.</span></a></header><main><h1>Welcome to your studio.</h1><p>Enter your email and we’ll send you a link to sign in. No password to remember.</p><form id="signin"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"><button id="send">Email me a sign-in link</button></form><p class="status" id="status" role="status"></p><p class="small">Spectramotus is invite-only for now. Links expire in 15 minutes and can be used once.</p></main><script>const form=document.querySelector('#signin'),status=document.querySelector('#status'),button=document.querySelector('#send');form.onsubmit=async e=>{e.preventDefault();button.disabled=true;status.classList.remove('error');status.textContent='Requesting your link…';try{const r=await fetch('/auth/request',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Please check your email address.');status.textContent=d.message;button.textContent='Request another link'}catch(e){status.textContent=e.message;status.classList.add('error')}finally{button.disabled=false}};</script></body></html>
