[project]
name = "spectramotus"
version = "4.0.0a0"
description = "Spectramotus - living-portrait frames: spectramorphize a photo into an interactive animated portrait pack"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - Sondry" }
dependencies = [
    "numpy==1.26.4",
    "pillow>=10.2",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Generation pipeline (Mac): LivePortrait pins + matting + cloud providers + QA
pipeline = [
    "torch==2.3.0",
    "torchvision==0.18.0",
    "opencv-contrib-python==4.10.0.84",
    "onnxruntime>=1.17,<1.24",
    "mediapipe==0.10.31",
    "scipy>=1.13,<1.14",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pykalman>=0.9.7",
    "tyro==0.8.5",
    "transformers>=4.44,<5",
    "timm>=1.0",
    "kornia>=0.7",
    "einops>=0.8",
    "huggingface_hub>=0.24",
    "fal-client>=0.5",
    "httpx>=0.27",
    "anthropic>=1.0",
    "sqlmodel>=0.0.21",
    "av>=13",
]
# Player runtime (Mac + Raspberry Pi): torch-free
player = [
    "pygame==2.6.1",
    "av>=13",
]
# Sensing runtime (Mac + Raspberry Pi): torch-free
sense = [
    "mediapipe==0.10.31",
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    "onnxruntime>=1.17,<1.24",
]
# GUI backend (Success 2)
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "sqlmodel>=0.0.21",
]
runway = ["runwayml>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
spectramotus = "spectramotus.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectramotus"]

[tool.uv]
# torch 2.3.0 CPU/MPS wheels come from PyPI on macOS arm64; no extra index needed.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
